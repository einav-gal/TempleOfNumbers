<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <title>Temple of the Lost Numbers</title>
    <!-- Bellefair: the game's one shared font, Hebrew + Latin alike (see src/game/textStyle.ts). Regular weight only. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bellefair&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow: hidden;
        background: #000;
      }

      /* Explicit (not the `manipulation` shorthand) so it's unambiguous
         pinch-zoom is preserved everywhere the game itself is shown —
         html/body never actually scroll (nothing overflows a
         position:fixed, viewport-sized #game), so allowing pan-x/pan-y
         here costs nothing while matching the most broadly-tested
         touch-action value combination across browsers. */
      html,
      body,
      #game,
      #game canvas {
        touch-action: pan-x pan-y pinch-zoom;
      }

      /* No wrapper around #game carries its own max-width/padding/margin
         or fixed size — it always fills the viewport so Phaser's own
         Scale Manager (see src/main.ts — FIT on desktop/tablet, ENVELOP
         on short phone-landscape screens) has the full available space
         to work with, with no extra frame ever clipping or scrolling it.
         `position: fixed` keeps it pinned to the real viewport even
         while mobile browser chrome (address bar) is showing/hiding. */
      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }

      /* Phaser sets the canvas's own CSS width/height directly to
         implement whichever scale mode is active. Under FIT that canvas
         is already never bigger than #game, so `margin: auto` centering
         is a harmless no-op; under ENVELOP (phone landscape) the canvas
         is deliberately made TALLER than #game so the extra height can
         crop off top/bottom via #game's own overflow:hidden. Forcing
         `width: 100%; height: 100%` here (or max-width/max-height: 100%)
         would fight that intentional oversize and squash the image, so
         nothing here constrains the canvas's own size at all — only
         Phaser's Scale Manager does. */
      #game canvas {
        display: block;
        margin: 0 auto;
      }

      /* True (OS-level) fullscreen — requested from the intro's own
         "כניסה למקדש" button, or the small standalone toggle below (see
         src/fullscreen.ts). Same centering approach as the normal case,
         just against the fullscreen viewport instead of the browser one. */
      #game:fullscreen,
      #game:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
        background: #000;
      }

      #game:fullscreen canvas,
      #game:-webkit-full-screen canvas {
        margin: 0 auto;
      }

      /* Always-present control to enter/exit fullscreen (icon + aria-label
         both swap on fullscreenchange — see main.ts) — e.g. re-entering
         after the player leaves it via the browser's own UI/back gesture
         mid-game. Hidden entirely when the Fullscreen API isn't
         supported at all (see setUpFullscreenToggleButton() in
         src/main.ts) rather than left as a dead button. Kept clear of
         notches/rounded corners/home-indicator via the safe-area insets,
         never as padding on #game itself (that would shrink the canvas).
         Sized above the 48x48px minimum comfortable touch target, and
         given its own stacking context (fixed + z-index) so it's always
         above the canvas regardless of DOM order. */
      #fullscreen-toggle {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        right: calc(env(safe-area-inset-right, 0px) + 10px);
        z-index: 10000;
        width: 52px;
        height: 52px;
        min-width: 48px;
        min-height: 48px;
        padding: 0;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.5);
        color: #f2e9d8;
        font-size: 24px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: manipulation;
      }

      #fullscreen-toggle:hover {
        background: rgba(0, 0, 0, 0.7);
      }

      /* Brief informational toast (see showFullscreenToast() in main.ts) —
         shown only when actually entering fullscreen, since pinch-zoom
         support while fullscreen is browser-dependent. */
      #fullscreen-toast {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 68px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 10001;
        max-width: min(90vw, 440px);
        padding: 10px 18px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.82);
        color: #f2e9d8;
        font-family: 'Bellefair', serif;
        font-size: 15px;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }

      #fullscreen-toast.visible {
        opacity: 1;
      }

      /* Portrait-only prompt to rotate — pure CSS, so it appears/disappears
         immediately on rotation with no JS orientation listener needed. */
      #rotate-overlay {
        display: none;
      }

      @media (orientation: portrait) {
        #rotate-overlay {
          display: flex;
        }

        #fullscreen-toggle {
          display: none;
        }
      }

      #rotate-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        background: #000;
        color: #f2e9d8;
        font-family: 'Bellefair', serif;
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <button id="fullscreen-toggle" type="button" aria-label="מסך מלא" title="מסך מלא">
      <span id="fullscreen-toggle-icon" aria-hidden="true">⛶</span>
    </button>
    <div id="fullscreen-toast" role="status" aria-live="polite"></div>
    <div id="rotate-overlay">
      <p>סובבו את המכשיר למצב מאוזן</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
